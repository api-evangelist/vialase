aid: vialase
name: ViaLase
description: 'ViaLase, Inc. is a globally-minded, venture and strategic capital-backed, clinical stage
  medical technology company headquartered in Aliso Viejo, California, founded and led by Tibor Juhasz,
  PhD. The company develops the ViaLuxe Laser System, which combines femtosecond laser technology with
  micron-resolution OCT image guidance to perform femtosecond laser image-guided high-precision trabeculotomy
  (FLigHT) — a noninvasive, non-incisional procedure that creates drainage apertures through the trabecular
  meshwork to lower intraocular pressure in patients with open-angle glaucoma. The system pairs the ViaLuxe
  laser with the ViaLens patient interface and the ViaVue gonio camera. The company closed an approximately
  $40 million Series C financing in April 2024 with participation from Venture Investors Health Fund,
  Arboretum Ventures and Falcon Vision. The ViaLase Laser received CE Mark approval in the European Union
  in 2024 for adult patients with primary open-angle glaucoma and is under evaluation in a US IDE clinical
  trial; it is not approved for sale in the United States. ViaLase is a medical device manufacturer rather
  than a software vendor: it publishes no public API, developer portal, SDK, or machine-readable specification,
  and vialase.com is a WordPress marketing and clinical-education site.'
